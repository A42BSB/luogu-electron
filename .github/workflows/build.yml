name: Build Windows x64 & ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ===== x64 Electron =====
      - name: Download & Extract Electron x64
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-x64.zip" -OutFile "electron-x64.zip"
          New-Item -ItemType Directory -Force -Path "electron-dist"
          7z x electron-x64.zip -o"./electron-dist" -y
          dir ./electron-dist

      # ===== ARM64 Electron =====
      - name: Download & Extract Electron ARM64
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-arm64.zip" -OutFile "electron-arm64.zip"
          New-Item -ItemType Directory -Force -Path "electron-dist-arm64"
          7z x electron-arm64.zip -o"./electron-dist-arm64" -y
          dir ./electron-dist-arm64

      # ===== Build x64 =====
      - name: Build x64
        shell: pwsh
        run: |
          npx electron-builder --win --x64 "--config.electronDist=./electron-dist" --publish never

      # ===== Build ARM64 =====
      - name: Build ARM64
        shell: pwsh
        run: |
          npx electron-builder --win --arm64 "--config.electronDist=./electron-dist-arm64" --publish never

      # ===== Upload Artifacts =====
      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: luogu-electron-installers
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
