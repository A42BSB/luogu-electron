name: Build & Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download & Extract Electron x64
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-x64.zip" -OutFile "electron-x64.zip"
          New-Item -ItemType Directory -Force -Path "electron-dist"
          7z x electron-x64.zip -o"./electron-dist" -y

      - name: Build x64
        shell: pwsh
        run: |
          npx electron-builder --win --x64 `
            "--config.electronDist=./electron-dist" `
            --publish never

      - name: Rename latest.yml → latest-x64.yml
        shell: pwsh
        run: |
          if (Test-Path "dist/latest.yml") {
            Move-Item "dist/latest.yml" "dist/latest-x64.yml" -Force
          }

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-x64
          path: |
            dist/*.exe
            dist/latest-x64.yml
            dist/*.blockmap

  build-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download & Extract Electron ARM64
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-arm64.zip" -OutFile "electron-arm64.zip"
          New-Item -ItemType Directory -Force -Path "electron-dist-arm64"
          7z x electron-arm64.zip -o"./electron-dist-arm64" -y

      - name: Build ARM64
        shell: pwsh
        run: |
          npx electron-builder --win --arm64 `
            "--config.electronDist=./electron-dist-arm64" `
            --publish never

      - name: Rename latest.yml → latest-arm64.yml
        shell: pwsh
        run: |
          if (Test-Path "dist/latest.yml") {
            Move-Item "dist/latest.yml" "dist/latest-arm64.yml" -Force
          }

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-arm64
          path: |
            dist/*.exe
            dist/latest-arm64.yml
            dist/*.blockmap

  release:
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Prepare latest.yml for x64
        run: |
          cp dist-x64/latest-x64.yml latest.yml

      - name: Create / Update Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: |
            dist-x64/*
            dist-arm64/*
            latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}