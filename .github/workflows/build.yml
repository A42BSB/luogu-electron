name: Build Windows x64 & ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ===== x64 Electron =====
      - name: Download Electron x64
        shell: bash
        run: |
          curl -L -o electron-x64.zip \
            https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-x64.zip
          mkdir electron-dist
          tar -xf electron-x64.zip -C electron-dist

      # ===== ARM64 Electron =====
      - name: Download Electron ARM64
        shell: bash
        run: |
          curl -L -o electron-arm64.zip \
            https://mirrors.huaweicloud.com/electron/43.2.0/electron-v43.2.0-win32-arm64.zip
          mkdir electron-dist-arm64
          tar -xf electron-arm64.zip -C electron-dist-arm64

      # ===== Build x64 =====
      - name: Build x64
        run: |
          npx electron-builder --win --x64 `
            -c.electronDist=electron-dist
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # ===== Build ARM64 =====
      - name: Build ARM64
        run: |
          npx electron-builder --win --arm64 `
            -c.electronDist=electron-dist-arm64
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      # ===== Upload Artifacts =====
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: luogu-electron-installers
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
